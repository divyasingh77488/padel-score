# XcodeGen spec for the Apple Watch app. Generate the Xcode project with:
#   brew install xcodegen
#   cd apple && xcodegen
# PadelScore.xcodeproj is generated, so it isn't committed; edit this file instead.
name: PadelScore
options:
  deploymentTarget:
    watchOS: "10.0"
packages:
  PadelScoreKit:
    path: PadelScoreKit
targets:
  PadelScoreWatch:
    type: application
    platform: watchOS
    sources:
      - PadelScoreWatch
    dependencies:
      - package: PadelScoreKit
    settings:
      base:
        PRODUCT_NAME: PadelScore
        PRODUCT_BUNDLE_IDENTIFIER: com.divyasingh.padelscore.watch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        # Personal team of divyasingh77488@gmail.com (free Apple ID).
        DEVELOPMENT_TEAM: 38J8F87MS5
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Padel Battle
        # A watch-only app: installs on the watch without an iPhone app.
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
schemes:
  PadelScoreWatch:
    build:
      targets:
        PadelScoreWatch: all
    run:
      config: Release
